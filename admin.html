<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVK Global — Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root { --blue:#0095da; --ink:#0c1b33; --danger:#e63946; --success:#2dc653; --bg:#f4f6f9; --white:#ffffff; --border:#dde3ec; --text:#4a5568; }
        *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

        /* Login */
        #login-screen { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#0c1b33 0%,#0a3055 100%); }
        .login-card { background:var(--white); border-radius:20px; padding:48px 40px; width:100%; max-width:420px; box-shadow:0 24px 64px rgba(0,0,0,.35); text-align:center; }
        .login-logo { display:inline-flex; align-items:center; gap:10px; margin-bottom:28px; }
        .login-logo-icon { width:44px; height:44px; background:var(--ink); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.4rem; }
        .login-logo span { font-family:'Outfit',sans-serif; font-size:1.3rem; font-weight:800; color:var(--ink); }
        .login-card h2 { font-family:'Outfit',sans-serif; font-size:1.5rem; color:var(--ink); margin-bottom:6px; }
        .login-card p { font-size:.88rem; color:var(--text); margin-bottom:32px; }
        .login-field { position:relative; margin-bottom:16px; }
        .login-field input { width:100%; padding:14px 16px; border:1.5px solid var(--border); border-radius:10px; font-size:.95rem; outline:none; transition:border-color .2s; background:var(--bg); }
        .login-field input:focus { border-color:var(--blue); }
        .login-btn { width:100%; padding:14px; background:var(--blue); color:#fff; font-weight:700; font-size:1rem; border-radius:10px; border:none; cursor:pointer; margin-top:8px; transition:background .2s,transform .1s; }
        .login-btn:hover { background:#007ab8; transform:translateY(-1px); }
        .login-error { margin-top:14px; padding:10px 14px; background:#ffe5e7; border:1px solid #ffb3b8; border-radius:8px; color:var(--danger); font-size:.85rem; display:none; }

        /* Admin Header */
        #admin-panel { display:none; }
        .admin-header { background:var(--ink); padding:0 32px; display:flex; align-items:center; justify-content:space-between; height:64px; position:sticky; top:0; z-index:100; box-shadow:0 2px 16px rgba(0,0,0,.2); }
        .admin-brand { display:flex; align-items:center; gap:10px; color:#fff; font-family:'Outfit',sans-serif; font-weight:800; font-size:1.1rem; }
        .admin-brand-icon { width:34px; height:34px; background:var(--blue); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:1rem; }
        .header-right { display:flex; align-items:center; gap:16px; }
        .admin-badge { background:rgba(0,149,218,.25); color:#5bc0eb; font-size:.75rem; font-weight:600; padding:4px 12px; border-radius:20px; border:1px solid rgba(0,149,218,.4); }
        .logout-btn { padding:7px 16px; background:rgba(255,255,255,.1); color:rgba(255,255,255,.8); border:1px solid rgba(255,255,255,.2); border-radius:8px; font-size:.83rem; font-weight:500; cursor:pointer; transition:background .2s; }
        .logout-btn:hover { background:rgba(255,255,255,.18); color:#fff; }

        /* Body */
        .admin-body { max-width:1100px; margin:0 auto; padding:40px 24px; }
        .admin-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:36px; }
        .stat-card { background:var(--white); border-radius:14px; padding:24px; display:flex; align-items:center; gap:16px; box-shadow:0 2px 12px rgba(0,0,0,.07); border:1px solid var(--border); }
        .stat-icon { width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.4rem; flex-shrink:0; }
        .stat-icon.blue { background:rgba(0,149,218,.12); }
        .stat-icon.green { background:rgba(45,198,83,.12); }
        .stat-icon.red { background:rgba(230,57,70,.12); }
        .stat-num { font-family:'Outfit',sans-serif; font-size:2rem; font-weight:800; color:var(--ink); line-height:1; }
        .stat-lbl { font-size:.8rem; color:var(--text); margin-top:3px; }

        /* Panel header */
        .panel-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; }
        .panel-title { font-family:'Outfit',sans-serif; font-size:1.25rem; font-weight:700; color:var(--ink); }
        .filter-row { display:flex; gap:10px; flex-wrap:wrap; }
        .filter-btn { padding:7px 16px; border-radius:20px; border:1.5px solid var(--border); background:var(--white); font-size:.82rem; font-weight:600; cursor:pointer; transition:all .2s; color:var(--text); }
        .filter-btn.active, .filter-btn:hover { background:var(--blue); border-color:var(--blue); color:#fff; }
        .delete-all-btn { padding:8px 18px; background:rgba(230,57,70,.1); border:1.5px solid rgba(230,57,70,.3); color:var(--danger); border-radius:8px; font-size:.83rem; font-weight:600; cursor:pointer; transition:all .2s; }
        .delete-all-btn:hover { background:var(--danger); color:#fff; }

        /* Cards */
        #testimonials-list { display:grid; gap:16px; }
        .t-card { background:var(--white); border-radius:14px; padding:22px 24px; border:1px solid var(--border); box-shadow:0 2px 10px rgba(0,0,0,.05); display:grid; grid-template-columns:1fr auto; gap:16px; align-items:start; transition:box-shadow .2s; animation:slideIn .3s ease; }
        @keyframes slideIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .t-card:hover { box-shadow:0 6px 24px rgba(0,0,0,.1); }
        .t-card.flagged { border-left:4px solid var(--danger); background:#fff8f8; }
        .t-meta { display:flex; align-items:center; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
        .t-avatar { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,var(--blue),#0c1b33); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:1rem; flex-shrink:0; }
        .t-name { font-weight:700; color:var(--ink); font-size:.95rem; }
        .t-company { font-size:.8rem; color:var(--text); }
        .t-date { font-size:.75rem; color:#9aa5b4; margin-left:auto; }
        .t-stars { font-size:1rem; margin-bottom:8px; letter-spacing:1px; }
        .t-text { font-size:.9rem; color:var(--text); line-height:1.65; }
        .t-actions { display:flex; flex-direction:column; gap:8px; }
        .del-btn { padding:8px 14px; background:rgba(230,57,70,.08); border:1.5px solid rgba(230,57,70,.25); color:var(--danger); border-radius:8px; font-size:.8rem; font-weight:600; cursor:pointer; white-space:nowrap; transition:all .2s; }
        .del-btn:hover { background:var(--danger); color:#fff; border-color:var(--danger); }
        .flag-btn { padding:8px 14px; background:rgba(245,166,35,.08); border:1.5px solid rgba(245,166,35,.3); color:#b8860b; border-radius:8px; font-size:.8rem; font-weight:600; cursor:pointer; white-space:nowrap; transition:all .2s; }
        .flag-btn:hover { background:#f5a623; color:#fff; border-color:#f5a623; }

        .empty-state { text-align:center; padding:64px 24px; color:var(--text); }
        .empty-state .empty-icon { font-size:3rem; margin-bottom:16px; }
        .empty-state h3 { font-size:1.1rem; color:var(--ink); margin-bottom:6px; }

        /* Toast */
        .toast { position:fixed; bottom:24px; right:24px; background:var(--ink); color:#fff; padding:12px 20px; border-radius:10px; font-size:.88rem; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,.25); z-index:9999; transform:translateY(80px); opacity:0; transition:all .35s cubic-bezier(.34,1.56,.64,1); }
        .toast.show { transform:translateY(0); opacity:1; }
        .toast.success { border-left:4px solid var(--success); }
        .toast.danger { border-left:4px solid var(--danger); }

        /* Confirm */
        .overlay { position:fixed; inset:0; background:rgba(12,27,51,.55); display:none; align-items:center; justify-content:center; z-index:1000; backdrop-filter:blur(4px); }
        .overlay.show { display:flex; }
        .confirm-box { background:var(--white); border-radius:16px; padding:32px 28px; max-width:380px; width:90%; text-align:center; box-shadow:0 24px 64px rgba(0,0,0,.3); animation:popIn .25s ease; }
        @keyframes popIn { from{transform:scale(.9);opacity:0} to{transform:scale(1);opacity:1} }
        .confirm-icon { font-size:2.5rem; margin-bottom:14px; }
        .confirm-box h3 { font-family:'Outfit',sans-serif; color:var(--ink); margin-bottom:8px; }
        .confirm-box p { font-size:.88rem; color:var(--text); margin-bottom:24px; }
        .confirm-btns { display:flex; gap:12px; justify-content:center; }
        .confirm-cancel { padding:10px 22px; border:1.5px solid var(--border); border-radius:8px; cursor:pointer; font-weight:600; background:var(--white); color:var(--text); }
        .confirm-cancel:hover { background:var(--bg); }
        .confirm-delete { padding:10px 22px; background:var(--danger); color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:700; }
        .confirm-delete:hover { background:#c1121f; }

        @media(max-width:640px){ .admin-stats{grid-template-columns:1fr 1fr;} .t-card{grid-template-columns:1fr;} .t-actions{flex-direction:row;} }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <div class="login-logo">
            <div class="login-logo-icon">🛡️</div>
            <span>DVK Global</span>
        </div>
        <h2>Admin Login</h2>
        <p>Restricted area — authorised personnel only</p>
        <div class="login-field"><input type="text" id="username" placeholder="Username" autocomplete="off"/></div>
        <div class="login-field"><input type="password" id="password" placeholder="Password"/></div>
        <button class="login-btn" onclick="doLogin()">Sign In →</button>
        <div class="login-error" id="login-error">❌ Incorrect username or password.</div>
    </div>
</div>

<div id="admin-panel">
    <header class="admin-header">
        <div class="admin-brand">
            <div class="admin-brand-icon">🛡️</div>
            DVK Global — Admin Panel
        </div>
        <div class="header-right">
            <span class="admin-badge">Testimonial Manager</span>
            <button class="logout-btn" onclick="doLogout()">Sign Out</button>
        </div>
    </header>
    <div class="admin-body">
        <div class="admin-stats">
            <div class="stat-card"><div class="stat-icon blue">💬</div><div><div class="stat-num" id="stat-total">0</div><div class="stat-lbl">Total Testimonials</div></div></div>
            <div class="stat-card"><div class="stat-icon green">⭐</div><div><div class="stat-num" id="stat-avg">—</div><div class="stat-lbl">Average Rating</div></div></div>
            <div class="stat-card"><div class="stat-icon red">🚩</div><div><div class="stat-num" id="stat-flagged">0</div><div class="stat-lbl">Flagged Reviews</div></div></div>
        </div>
        <div class="panel-header">
            <div class="panel-title">All Submitted Testimonials</div>
            <div class="filter-row">
                <button class="filter-btn active" onclick="filterReviews('all',this)">All</button>
                <button class="filter-btn" onclick="filterReviews('5',this)">⭐ 5 Star</button>
                <button class="filter-btn" onclick="filterReviews('low',this)">⚠️ Low Rating</button>
                <button class="filter-btn" onclick="filterReviews('flagged',this)">🚩 Flagged</button>
                <button class="delete-all-btn" onclick="confirmDeleteAll()">🗑 Delete All</button>
            </div>
        </div>
        <div id="testimonials-list"></div>
    </div>
</div>

<div class="overlay" id="confirm-overlay">
    <div class="confirm-box">
        <div class="confirm-icon">⚠️</div>
        <h3 id="confirm-title">Delete Testimonial?</h3>
        <p id="confirm-msg">This action cannot be undone.</p>
        <div class="confirm-btns">
            <button class="confirm-cancel" onclick="closeConfirm()">Cancel</button>
            <button class="confirm-delete" id="confirm-ok">Delete</button>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
    const ADMIN_USER='dvkadmin', ADMIN_PASS='DVKGlobal@2024', STORAGE_KEY='dvk_testimonials';
    let currentFilter='all', pendingDeleteIndex=null;

    function doLogin(){
        const u=document.getElementById('username').value.trim();
        const p=document.getElementById('password').value;
        const err=document.getElementById('login-error');
        if(u===ADMIN_USER&&p===ADMIN_PASS){
            document.getElementById('login-screen').style.display='none';
            document.getElementById('admin-panel').style.display='block';
            err.style.display='none';
            loadTestimonials('all');
        }else{
            err.style.display='block';
            document.getElementById('password').value='';
        }
    }

    document.addEventListener('keydown',e=>{
        if(e.key==='Enter'&&document.getElementById('login-screen').style.display!=='none') doLogin();
    });

    function doLogout(){
        document.getElementById('login-screen').style.display='flex';
        document.getElementById('admin-panel').style.display='none';
        document.getElementById('username').value='';
        document.getElementById('password').value='';
    }

    function getTestimonials(){ try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];}catch{return[];} }
    function saveTestimonials(arr){ localStorage.setItem(STORAGE_KEY,JSON.stringify(arr)); }

    function loadTestimonials(filter){
        currentFilter=filter;
        const all=getTestimonials();
        updateStats(all);
        let list=[...all];
        if(filter==='5')      list=all.filter(t=>t.rating>=5);
        if(filter==='low')    list=all.filter(t=>t.rating<=2);
        if(filter==='flagged')list=all.filter(t=>t.flagged);
        renderList(list,all);
    }

    function updateStats(all){
        document.getElementById('stat-total').textContent=all.length;
        document.getElementById('stat-flagged').textContent=all.filter(t=>t.flagged).length;
        document.getElementById('stat-avg').textContent=all.length?(all.reduce((s,t)=>s+(t.rating||5),0)/all.length).toFixed(1):'—';
    }

    function escHtml(str){ return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function renderList(list,allList){
        const c=document.getElementById('testimonials-list');
        if(!list.length){
            c.innerHTML='<div class="empty-state"><div class="empty-icon">📭</div><h3>No testimonials found</h3><p>No reviews match the selected filter.</p></div>';
            return;
        }
        c.innerHTML=list.map(t=>{
            const ri=allList.indexOf(t);
            const stars='★'.repeat(t.rating||5)+'☆'.repeat(5-(t.rating||5));
            const ini=(t.name||'A').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
            const dt=t.date?new Date(t.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):'—';
            return `<div class="t-card ${t.flagged?'flagged':''}" id="card-${ri}">
                <div>
                    <div class="t-meta">
                        <div class="t-avatar">${ini}</div>
                        <div><div class="t-name">${escHtml(t.name)}</div><div class="t-company">${escHtml(t.company||'')}</div></div>
                        <div class="t-date">📅 ${dt}</div>
                    </div>
                    <div class="t-stars" style="color:#f5a623">${stars}</div>
                    <div class="t-text">"${escHtml(t.text||t.quote||'')}"</div>
                </div>
                <div class="t-actions">
                    <button class="del-btn" onclick="confirmDelete(${ri})">🗑 Delete</button>
                    <button class="flag-btn" onclick="toggleFlag(${ri})">${t.flagged?'✅ Unflag':'🚩 Flag'}</button>
                </div>
            </div>`;
        }).join('');
    }

    function filterReviews(f,btn){
        document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        loadTestimonials(f);
    }

    function toggleFlag(i){
        const all=getTestimonials();
        if(all[i]){all[i].flagged=!all[i].flagged;saveTestimonials(all);loadTestimonials(currentFilter);showToast(all[i].flagged?'🚩 Review flagged':'✅ Flag removed','success');}
    }

    function confirmDelete(i){
        pendingDeleteIndex=i;
        document.getElementById('confirm-title').textContent='Delete this testimonial?';
        document.getElementById('confirm-msg').textContent='This review will be permanently removed from the website.';
        document.getElementById('confirm-ok').onclick=executeSingleDelete;
        document.getElementById('confirm-overlay').classList.add('show');
    }

    function executeSingleDelete(){
        const all=getTestimonials();
        if(pendingDeleteIndex!==null&&all[pendingDeleteIndex]){
            all.splice(pendingDeleteIndex,1);saveTestimonials(all);closeConfirm();loadTestimonials(currentFilter);showToast('🗑 Testimonial deleted','danger');
        }
    }

    function confirmDeleteAll(){
        document.getElementById('confirm-title').textContent='Delete ALL testimonials?';
        document.getElementById('confirm-msg').textContent='This will permanently remove every review from the website.';
        document.getElementById('confirm-ok').onclick=executeDeleteAll;
        document.getElementById('confirm-overlay').classList.add('show');
    }

    function executeDeleteAll(){saveTestimonials([]);closeConfirm();loadTestimonials('all');showToast('🗑 All testimonials deleted','danger');}
    function closeConfirm(){document.getElementById('confirm-overlay').classList.remove('show');pendingDeleteIndex=null;}
    document.getElementById('confirm-overlay').addEventListener('click',function(e){if(e.target===this)closeConfirm();});

    let toastTimer;
    function showToast(msg,type='success'){
        const t=document.getElementById('toast');t.textContent=msg;t.className=`toast ${type} show`;
        clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
    }
</script>
</body>
</html>
